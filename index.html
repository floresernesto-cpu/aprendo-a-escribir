<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f4f7ff">
<title>Aprendo a Escribir · V2</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap');
:root{--blue:#3978e8;--red:#e53935;--ink:#20242b;--guide:#bfc7d4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:Nunito,Arial,sans-serif;background:#f4f7ff;color:var(--ink)}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.app{width:min(1100px,100%);margin:auto;padding:10px}.top,.card{background:#fff;border-radius:22px;box-shadow:0 5px 20px #00000010}
.top{padding:14px}.brand{font-size:25px;font-weight:800;margin-bottom:10px}.row{display:flex;gap:9px;flex-wrap:wrap}
input{flex:1;min-width:180px;padding:12px 14px;border:2px solid #d8dfeb;border-radius:14px;font-size:22px;outline:0;font-family:inherit}
input:focus{border-color:var(--blue)}button{font-family:inherit;touch-action:manipulation;user-select:none;-webkit-user-select:none;position:relative;z-index:20;pointer-events:auto;cursor:pointer;border:0;border-radius:14px;padding:12px 17px;font-size:19px;font-weight:800}
.primary{background:var(--blue);color:#fff}.secondary{background:#e9eef7;color:#273246}
.info{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:15px 2px 10px;flex-wrap:wrap}.word{font-size:31px;font-weight:800}.status{color:#687386;font-size:18px}
.card{padding:12px}.board{position:relative;width:100%;height:min(62vh,540px);min-height:310px;border:3px solid #dce3ee;border-radius:18px;overflow:hidden;background:repeating-linear-gradient(to bottom,#fff 0,#fff 33%,#edf2fb 33.3%,#fff 33.7%)}
#wordSvg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.letter{font-family:Nunito,Arial,sans-serif;font-weight:800;text-anchor:middle;paint-order:stroke;vector-effect:non-scaling-stroke}
.guide{fill:transparent;stroke:var(--guide);stroke-width:2.5;stroke-dasharray:3 5}
.active{fill:transparent;stroke-width:5}.active.red{stroke:var(--red)}.active.black{stroke:var(--ink)}
.panel{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;flex-wrap:wrap}
.instruction{font-size:20px;font-weight:800;flex:1;min-width:230px}.actions{display:flex;gap:8px}.actions button{min-width:112px}
.dots{display:flex;gap:7px;margin-top:10px;justify-content:center}.dots i{width:11px;height:11px;border-radius:50%;background:#d7deea}.dots i.done{background:var(--ink)}.dots i.active{background:var(--red);transform:scale(1.25)}
.tip{margin-top:10px;padding:12px 14px;border-radius:14px;background:#fff8e8;font-size:17px;line-height:1.35}#success{display:none;text-align:center;padding:18px;font-size:28px;font-weight:800}
@media(max-width:600px){.app{padding:8px}.brand{font-size:22px}.row{display:grid;grid-template-columns:1fr 1fr}.row input{grid-column:1/-1;width:100%;min-width:0}button{padding:11px 9px}.word{font-size:26px}.status{font-size:16px}.board{height:55vh;min-height:300px}.instruction{font-size:18px}}
@media(orientation:landscape) and (max-height:600px){.board{height:65vh;min-height:250px}.top{padding:9px}.info{margin:8px 2px}}
</style>
</head>
<body>
<div class="app">
 <section class="top">
  <div class="brand">✏️ Aprendo a Escribir <small>V3 · misma tipografía</small></div>
  <div class="row">
   <input id="word" maxlength="18" inputmode="text" autocomplete="off" autocapitalize="words" placeholder="Escribe una palabra">
   <button class="btn" id="start">▶ Comenzar</button>
   <button class="btn secondary" id="repeat">↻ Repetir</button>
  </div>
 </section>

 <div class="info">
  <div class="word" id="wordLabel">Escribe una palabra</div>
  <div class="status" id="status"></div>
 </div>

 <section class="card">
  <div class="board" id="board">
   <div class="guide"><span id="guideLetter"></span></div>
   <div class="center-letter" id="centerLetter"></div>
   <svg id="wordSvg" viewBox="0 0 1000 540" preserveAspectRatio="xMidYMid meet" aria-label="Palabra para practicar"></svg>
  </div>
  <div class="panel">
   <div class="instruction" id="instruction">Escribe una palabra y toca “Comenzar”.</div>
   <div class="actions">
    <button class="btn secondary" id="slow">🐢 Lento</button>
    <button class="btn secondary" id="next">Siguiente ▶</button>
   </div>
  </div>
  <div class="dots" id="dots"></div>
  <div class="tip">👆 <b>En celular o tablet:</b> toca “Siguiente” o toca el área de la letra. Primero observa la demostración y después puedes intentar copiarla con el dedo.</div>
  <div id="success">🎉 ¡Muy bien! ¡Terminaste!</div>
 </section>
</div>

<script>
const NS="http://www.w3.org/2000/svg";const $=id=>document.getElementById(id);
let letters=[],idx=0,slow=false,busy=false;
function normalize(v){v=v.trim().replace(/\s+/g,"").toLowerCase();return v?v[0].toUpperCase()+v.slice(1):""}
function el(tag,attrs={}){const e=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);return e}
function renderDots(){$("dots").innerHTML="";letters.forEach((_,i)=>{const d=document.createElement("i");if(i<idx)d.className="done";if(i===idx)d.className="active";$("dots").appendChild(d)})}
function buildWord(){
 const svg=$("wordSvg");svg.innerHTML="";const n=letters.length;
 const fs=n<=5?170:n<=8?145:n<=11?115:92,gap=n<=5?28:n<=8?20:12;
 const factors=letters.map(c=>"ilÍíj".includes(c)?0.42:"mw".includes(c)?0.9:0.66);
 const total=factors.reduce((a,b)=>a+b,0)*fs+gap*(n-1);
 let x=(1000-total)/2+20;
 letters.forEach((ch,i)=>{
   const w=factors[i]*fs;x+=w/2;
   const guide=el("text",{x,y:335,class:"letter guide"});guide.style.fontSize=fs+"px";guide.textContent=ch;svg.appendChild(guide);
   const active=el("text",{x,y:335,class:"letter active "+(i===0?"red":"black"),opacity:i<idx?1:0});
   active.style.fontSize=fs+"px";active.textContent=ch;active.dataset.index=i;svg.appendChild(active);
   x+=w/2+gap;
 });
}
function animateCurrent(){
 if(idx>=letters.length){finish();return}
 buildWord();renderDots();busy=true;
 const active=[...$("wordSvg").querySelectorAll(".active")][idx];
 const duration=slow?1900:1050;
 active.setAttribute("opacity","1");
 active.animate([
   {fill:"transparent",strokeDasharray:"3 11",strokeDashoffset:"150"},
   {fill:"transparent",strokeDasharray:"900 0",strokeDashoffset:"0"},
   {fill:idx===0?"#e53935":"#20242b",strokeDasharray:"900 0",strokeDashoffset:"0"}
 ],{duration,easing:"ease-in-out",fill:"forwards"});
 const r=active.getBoundingClientRect();
 const cursor=el("circle",{cx:parseFloat(active.getAttribute("x"))-r.width/2,cy:335,r:7,fill:idx===0?"#e53935":"#20242b"});
 $("wordSvg").appendChild(cursor);
 cursor.animate([{cx:parseFloat(active.getAttribute("x"))-r.width/2},{cx:parseFloat(active.getAttribute("x"))+r.width/2}],{duration,easing:"ease-in-out",fill:"forwards"});
 $("status").textContent=`Letra ${idx+1} de ${letters.length}`;
 $("instruction").textContent=idx===0?"Observa la primera letra: se remarca en rojo.":"Observa la letra y después intenta copiarla.";
 setTimeout(()=>{cursor.remove();busy=false},duration+80);
}
function start(){const w=normalize($("word").value);if(!w){$("wordLabel").textContent="Escribe una palabra";return}
 $("word").value=w;letters=[...w.toLowerCase()];idx=0;$("wordLabel").textContent=w;$("success").style.display="none";animateCurrent()}
function next(){if(!letters.length){start();return}if(busy)return;idx++;animateCurrent()}
function repeat(){if(letters.length&&!busy)animateCurrent()}
function finish(){buildWord();$("status").textContent="¡Palabra terminada!";$("instruction").textContent="¡Excelente trabajo!";$("success").style.display="block";renderDots()}
function bindTap(id,fn){const e=$(id);e.addEventListener("click",x=>{x.preventDefault();x.stopPropagation();fn()},{passive:false});e.addEventListener("touchend",x=>{x.preventDefault();x.stopPropagation();fn()},{passive:false})}
bindTap("start",start);bindTap("next",next);bindTap("repeat",repeat);
bindTap("slow",()=>{slow=!slow;$("slow").textContent=slow?"🐢 Lento ✓":"🐢 Lento"});
$("word").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();start()}});
$("board").addEventListener("click",e=>{if(!e.target.closest("button,input"))next()});
$("board").addEventListener("touchend",e=>{if(!e.target.closest("button,input")){e.preventDefault();next()}},{passive:false});
</script>
</body>
</html>
